<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodtune — a song for how you feel</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,system-ui,sans-serif; background:#0e0e12;
         color:#ececf1; display:flex; flex-direction:column; height:100vh; }
  header { padding:20px; text-align:center; border-bottom:1px solid #23232b; }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:#9a9aa8; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:680px; padding:12px 16px; border-radius:14px; line-height:1.5; white-space:pre-wrap; }
  .user { align-self:flex-end; background:#3a6df0; color:#fff; border-bottom-right-radius:4px; }
  .bot  { align-self:flex-start; background:#1b1b22; border:1px solid #26262f; border-bottom-left-radius:4px; }
  .bot a { color:#7aa2ff; }
  .loader { align-self:flex-start; color:#9a9aa8; font-style:italic; }
  form { display:flex; gap:10px; padding:16px 20px; border-top:1px solid #23232b; }
  input { flex:1; padding:12px 14px; border-radius:12px; border:1px solid #2c2c37;
          background:#16161c; color:#ececf1; font-size:15px; outline:none; }
  button { padding:12px 20px; border:none; border-radius:12px; background:#3a6df0;
           color:#fff; font-size:15px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
</style>
</head>
<body>
  <header>
    <h1>🎵 Moodtune</h1>
    <p>Tell me how you feel or what's going on — I'll find a song for it.</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="e.g. I'm anxious about my career and my future…" />
    <button id="send" type="submit">Send</button>
  </form>
<script>
  const chat=document.getElementById('chat'),form=document.getElementById('form'),
        input=document.getElementById('input'),send=document.getElementById('send');
  function addMessage(text,cls){
    const d=document.createElement('div'); d.className='msg '+cls;
    if(cls==='bot') d.innerHTML=linkify(text); else d.textContent=text;
    chat.appendChild(d); chat.scrollTop=chat.scrollHeight; return d;
  }
  function linkify(t){
    const e=t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    let o=e.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
    o=o.replace(/(^|[^"'>])(https?:\/\/[^\s<]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return o;
  }
  form.addEventListener('submit',async(ev)=>{
    ev.preventDefault();
    const text=input.value.trim(); if(!text) return;
    addMessage(text,'user'); input.value=''; send.disabled=true;
    const loader=addMessage('finding the right song…','loader');
    try{
      const res=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({message:text})});
      const data=await res.json();
      loader.remove(); addMessage(data.reply||'Hmm, nothing came back — try again?','bot');
    }catch(err){
      loader.remove(); addMessage('Could not reach the agent — is the server running?','bot');
    }finally{ send.disabled=false; input.focus(); }
  });
</script>
</body>
</html>
