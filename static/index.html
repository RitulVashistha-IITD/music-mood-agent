<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moodtune</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <button id="theme-toggle" aria-label="Toggle light and dark" title="Toggle theme">🌙</button>
    <h1>Moodtune</h1>
    <p>Tell me how you feel or what's going on — I'll find a song for it.</p>
  </header>
  <div id="chat"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="e.g. I'm anxious about my career and my future…">
    <button id="send" type="submit">Send</button>
  </form>
  <script src="/app.js"></script>
</body>
</html>
